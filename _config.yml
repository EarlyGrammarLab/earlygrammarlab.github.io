baseurl: '/'
permalink: pretty
title: 'EAGLeLab'

logo:
  mobile: "images/logo/logo_mobile.svg"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/logo_mobile.svg"
  desktop_height: "32px"
  desktop_width: "32px"

home: 
  limit_services: 6


collections_dir: content
collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true
  publications:
    output: true
    sort_by: year

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"
  - scope:
      path: "_team/en/"
      type: "team"
    values:
      lang: "en"
  - scope:
      path: "_team/cs/"
      type: "team"
    values:
      lang: "cs"
  - scope:
      path: "_services/en/"
      type: "service"
    values:
      lang: "en"
  - scope:
      path: "_services/cs/"
      type: "service"
    values:
      lang: "cs"
  - scope:
      path: "en/"
    values:
      lang: "en"
  - scope:
      path: "cs/"
    values:
      lang: "cs"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
