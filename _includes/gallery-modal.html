{% if page.gallery_modal_loaded != true %}
<div id="imageModal" class="modal">
  <span class="close">&times;</span>
  <span class="nav-btn nav-prev">&#10094;</span>
  <img class="modal-content" id="modalImage">
  <span class="nav-btn nav-next">&#10095;</span>
  <div id="caption"></div>
</div>

<style>
  .horizontal-gallery {
    display: flex;
    overflow-x: auto;
    gap: 15px;
    padding: 10px 0;
    white-space: nowrap;
    cursor: pointer;
  }
  .horizontal-gallery::-webkit-scrollbar { height: 8px; }
  .horizontal-gallery::-webkit-scrollbar-thumb {
    background: #888; border-radius: 4px;
  }
  .horizontal-gallery img {
    width: auto;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }
  .horizontal-gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  .modal {
    display: none; position: fixed; z-index: 1000;
    left: 0; top: 0; width: 100%; height: 100%;
    overflow: auto; background-color: rgba(0,0,0,0.8);
  }
  .modal-content {
    margin: auto; display: block;
    max-width: 90%; max-height: 85vh; margin-top: 5%;
    border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .modal-content.zoom { animation: zoom 0.3s; }
  @keyframes zoom {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }
  #caption {
    margin: auto; display: block; width: 80%; max-width: 700px;
    text-align: center; color: #ccc; padding: 10px 0; font-size: 16px;
  }
  .close {
    position: absolute; top: 15px; right: 35px;
    color: #f1f1f1; font-size: 40px; font-weight: bold;
    transition: 0.3s; cursor: pointer;
  }
  .close:hover, .close:focus { color: #bbb; }
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    color: #f1f1f1; font-size: 40px; font-weight: bold;
    cursor: pointer; transition: 0.3s; user-select: none;
    padding: 10px 20px; z-index: 1001;
  }
  .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .nav-prev { left: 0; }
  .nav-next { right: 0; }
  @media only screen and (max-width: 700px) {
    .modal-content { width: 100%; }
  }
</style>

<script>
(function () {
  const modal    = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImage');
  const caption  = document.getElementById('caption');
  const closeBtn = modal.querySelector('.close');
  const prevBtn  = modal.querySelector('.nav-prev');
  const nextBtn  = modal.querySelector('.nav-next');

  let images = [];
  let currentIndex = 0;

  function open(imageList, startIndex) {
    images = imageList;
    currentIndex = startIndex;
    showImage(currentIndex);
    modal.style.display = 'block';
  }

  function close() {
    modal.style.display = 'none';
    modalImg.classList.remove('zoom');
  }

  function showImage(index) {
    currentIndex = index;
    modalImg.src = images[currentIndex].dataset.src
      || images[currentIndex].src;
    caption.textContent = images[currentIndex].dataset.alt
      || images[currentIndex].alt;
    modalImg.classList.remove('zoom');
    void modalImg.offsetWidth;
    modalImg.classList.add('zoom');
  }

  function next() {
    currentIndex = (currentIndex + 1) % images.length;
    showImage(currentIndex);
  }

  function prev() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage(currentIndex);
  }

  closeBtn.onclick = close;
  prevBtn.onclick  = (e) => { e.stopPropagation(); prev(); };
  nextBtn.onclick  = (e) => { e.stopPropagation(); next(); };
  modal.onclick    = (e) => { if (e.target === modal) close(); };

  document.addEventListener('keydown', (e) => {
    if (modal.style.display !== 'block') return;
    if (e.key === 'Escape')          close();
    else if (e.key === 'ArrowLeft')  prev();
    else if (e.key === 'ArrowRight') next();
  });

  // --- Wire up every gallery on the page ---
  document.querySelectorAll('.horizontal-gallery').forEach(function (galleryEl) {
    const imgs = Array.from(galleryEl.querySelectorAll('img.zoomable'));

    imgs.forEach(function (img, index) {
      img.addEventListener('click', function () {
        open(imgs, index);
      });
    });

    // Smooth wheel-to-horizontal scroll
    let targetScroll  = galleryEl.scrollLeft;
    let animFrameId   = null;
    let lastSetScroll = galleryEl.scrollLeft;

    galleryEl.addEventListener('wheel', function (e) {
      e.preventDefault();
      targetScroll += e.deltaY;
      targetScroll = Math.max(0,
        Math.min(targetScroll, galleryEl.scrollWidth - galleryEl.clientWidth));
      if (animFrameId === null) {
        animFrameId = requestAnimationFrame(animate);
      }
    }, { passive: false });

    function animate() {
      if (Math.abs(galleryEl.scrollLeft - lastSetScroll) > 1) {
        targetScroll = galleryEl.scrollLeft;
      }
      const diff = targetScroll - galleryEl.scrollLeft;
      if (Math.abs(diff) < 0.5) {
        lastSetScroll = galleryEl.scrollLeft;
        animFrameId = null;
        return;
      }
      galleryEl.scrollLeft += diff * 0.15;
      lastSetScroll = galleryEl.scrollLeft;
      animFrameId = requestAnimationFrame(animate);
    }

    galleryEl.addEventListener('scroll', function () {
      if (animFrameId === null) {
        targetScroll = galleryEl.scrollLeft;
        lastSetScroll = galleryEl.scrollLeft;
      }
    });
  });
})();
</script>
{% endif %}
