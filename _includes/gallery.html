{% assign gallery = site.data.galleries[include.gallery] %}

{% if gallery %}
<div class="horizontal-gallery"
     id="gallery-{{ include.gallery }}"
     data-gallery="{{ include.gallery }}">
  {% for item in gallery.images %}
     {% if item.type == 'video' %}
     <video class="zoomable"
               src="{{ item.src }}"
               poster="{{ item.poster | default: '' }}"
               style="height: {{ gallery.height | default: '300px' }}"
               controls>
          Your browser does not support the video tag.
     </video>
     {% else %}
     <img src="{{ item.src }}"
          alt="{{ item.alt }}"
          class="zoomable"
          style="height: {{ gallery.height | default: '300px' }}" />
     {% endif %}
  {% endfor %}
</div>
{% else %}
<p style="color: red;">Gallery "{{ include.gallery }}" not found in _data/galleries.yml</p>
{% endif %}
