---
layout: default
bodyClass: "page-service"
---

<div class="container pb-6 pt-6 pt-md-10 pb-md-10">
  <div class="row justify-content-start">
    <div class="col-12 col-md-8">
      <div class="service service-single">
        <h1 class="title">{{page.title}}</h1>

        {% if page.group_development or page.group_age %}
        <div class="pill-row">
          {% if page.group_development %}
            <span class="pill pill--dev">{{ page.group_development }}</span>
          {% endif %}
          {% if page.group_age %}
            <span class="pill pill--age">{{ page.group_age }}</span>
          {% endif %}
        </div>
        <br/>
        {% endif %}

        <div class="content">{{content}}</div>
      </div>
    </div>
  </div>
</div>
