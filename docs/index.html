<p>&lt;!DOCTYPE html&gt;</p>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EAGLeLab</title>
  <script>
    (function() {
      var lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
      var supported = { 'cs': '/cs/', 'en': '/en/' };
      var target = supported[lang] || '/en/';
      window.location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/en/" />
</head>
<body>
  <p>Redirecting… <a href="/en/">Click here if you are not redirected.</a></p>
</body>
</html>
